[metadata]
name = wlm-agent
version = 1.0.0
description = Official WLM-Agent implementation for structure-first language diagnosis.
long_description = file: README.md
long_description_content_type = text/markdown
author = Wujie Gu (Gavin)
license = MIT
url = https://github.com/yourname/WLM-Agent

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9
install_requires =
    langchain>=0.1.0
    openai>=1.0.0
    livekit-agents>=0.5.0

[options.packages.find]
where = src

[tool:pytest]
testpaths = tests

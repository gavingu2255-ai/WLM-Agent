[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wlm-agent"
version = "1.0.0"
description = "Official WLM-Agent implementation for structure-first language diagnosis."
readme = "README.md"
requires-python = ">=3.9"

authors = [
    { name = "Wujie Gu (Gavin)" }
]

dependencies = [
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "livekit-agents>=0.5.0"
]

[project.urls]
Homepage = "https://github.com/yourname/WLM-Agent"
Repository = "https://github.com/yourname/WLM-Agent"

[tool.setuptools.packages.find]
where = ["src"]
